<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visualizer</title>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
  </head>

  <body>
    <div class="flex h-screen overflow-hidden">
      <!-- Sidebar -->
      <aside
        class="w-96 bg-slate-950 text-white flex flex-col border-r border-slate-800"
      >
       
        <!-- Controls -->
        <div class="p-5 space-y-4">
          <!-- Upload -->
          <label
            for="geojsonInput"
            class="flex items-center justify-center gap-2 cursor-pointer bg-blue-600 hover:bg-blue-500 transition px-4 py-3 rounded-xl font-medium shadow-lg shadow-blue-900/20"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-5 h-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"
              />
            </svg>

            Load GeoJSON
          </label>

          <input
            id="geojsonInput"
            type="file"
            accept=".geojson,.json"
            class="hidden"
          />

          <!-- Search -->
          <div class="relative">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M21 21l-4.35-4.35m1.35-5.65a7 7 0 11-14 0 7 7 0 0114 0z"
              />
            </svg>

            <input
              id="searchInput"
              type="text"
              placeholder="Search species..."
              class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-10 pr-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>

          <!-- Filter -->
          <select
            id="speciesFilter"
            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
            <option value="">All species</option>
          </select>
        </div>

        <!-- List Header -->
        <div
          class="px-5 pb-2 flex justify-between items-center text-sm text-slate-400"
        >
          <span> Occurrences </span>

          <span> Browse </span>
        </div>

        <!-- Entries -->
        <div
          id="entries"
          class="flex-1 overflow-y-auto px-5 pb-5 space-y-2"
        ></div>
      </aside>

      <!-- Map -->
      <main class="flex-1">
        <div id="map" class="w-full h-full"></div>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
